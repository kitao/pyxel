<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn how to create 3D games with Pyxel Cube."
    />
    <meta property="og:title" content="Pyxel Cube User Guide" />
    <meta
      property="og:description"
      content="Learn how to create 3D games with Pyxel Cube."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://kitao.dev/pyxel/user-guide/cube/"
    />
    <meta
      property="og:image"
      content="https://kitao.dev/pyxel/assets/images/pyxel_og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pyxel logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://kitao.dev/pyxel/user-guide/cube/" />
    <title>Pyxel Cube User Guide</title>
    <link rel="icon" href="../../../wasm/images/pyxel_icon_64x64.ico" />
    <link rel="stylesheet" href="../../styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.12.0/build/styles/github-dark.min.css"
    />
    <script src="../../shared.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.12.0/build/highlight.min.js"></script>
  </head>

  <body class="page min-h-full">
    <main class="page-container" id="app">
      <div class="flex justify-center items-center py-12 text-gray-400 text-sm">
        Loading...
      </div>
    </main>

    <script>
      let data = null;
      let lang = "en";

      function buildPage() {
        const app = document.getElementById("app");
        app.innerHTML = "";
        app.appendChild(buildPageHeader(updateTexts, buildVariantSwitch()));

        const wrap = document.createElement("div");
        wrap.className = "space-y-6";
        wrap.id = "content";
        wrap.innerHTML = `
          <section class="card" id="s-overview"></section>
          <div class="space-y-6" id="guide"></div>
        `;
        app.appendChild(wrap);
        updateTexts();
      }

      function updateTexts() {
        const pyxelLink = link("https://kitao.dev/pyxel/", "Pyxel");
        const videoLang = lang === "ja" ? "ja" : "en";
        const usageVideo = link(
          `videos/pyxel-cube-usage-${videoLang}.mp4`,
          lang === "ja" ? "Pyxel Cube の使い方" : "Using Pyxel Cube",
        );
        const assetVideo = link(
          `videos/pyxel-cube-assets-${videoLang}.mp4`,
          lang === "ja"
            ? "Pyxel Cube 向け 3D アセットの作り方"
            : "Creating 3D Assets for Pyxel Cube",
        );

        document.title = t("title");
        document.getElementById("page-title").textContent = t("title");
        document.getElementById("page-subtitle").innerHTML = t(
          "subtitle",
        ).replace("{0}", pyxelLink);

        document.getElementById("s-overview").innerHTML = `
          <h2 class="section-title">${esc(t("overview_title"))}</h2>
          <p class="body">${t("overview_body").replace("{0}", "<strong>Pyxel Cube</strong>")}</p>
          <p class="body mt-2">${t("overview_beginner").replace("{0}", link("https://kitao.dev/pyxel/user-guide/", t("base_guide")))}</p>
          <p class="body mt-2">${t("overview_advanced")}</p>
          <p class="body mt-2">${t("overview_videos_intro")}</p>
          <ul class="body mt-2 list-disc space-y-1 pl-6">
            <li>${t("overview_usage_video").replace("{0}", usageVideo)}</li>
            <li>${t("overview_asset_video").replace("{0}", assetVideo)}</li>
          </ul>`;

        const guide = data.guides.find((guide) => guide.language === lang);
        document.getElementById("guide").innerHTML = renderGuide(guide);

        setDocLang(lang);
        hljs.highlightAll();
      }

      function renderGuide(guide) {
        const advanced =
          ' <span class="adv-mark text-amber-500/70 text-[10px] leading-none ml-1.5 align-middle">ADV</span>';
        return guide.sections
          .map(
            (section) => `
              <section class="card" id="${esc(section.id)}">
                <h2 class="section-title">${esc(section.title)}${section.advanced ? advanced : ""}</h2>
                ${section.blocks
                  .map((block) =>
                    block.code !== undefined
                      ? code(block.code, block.syntax || "python")
                      : `<div class="body mt-2">${block.advanced ? block.text.replace("</h3>", `${advanced}</h3>`) : block.text}</div>`,
                  )
                  .join("")}
              </section>`,
          )
          .join("");
      }

      initPage("user-guide.json", buildPage);
    </script>
  </body>
</html>
