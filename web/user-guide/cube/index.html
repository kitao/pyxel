<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyxel Cube User Guide</title>
    <link rel="icon" href="../../../wasm/images/pyxel_icon_64x64.ico" />
    <link rel="stylesheet" href="../../styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css"
    />
    <script src="../../shared.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  </head>

  <body class="page min-h-full">
    <main class="page-container" id="app">
      <div class="flex justify-center items-center py-12 text-gray-400 text-sm">
        Loading...
      </div>
    </main>

    <script>
      let data = null;
      let lang = "en";

      function buildPage() {
        const app = document.getElementById("app");
        app.innerHTML = "";
        app.appendChild(buildPageHeader(updateTexts, buildVariantSwitch()));

        const wrap = document.createElement("div");
        wrap.className = "space-y-6";
        wrap.id = "content";
        wrap.innerHTML = `
          <section class="card" id="s-overview"></section>
          <section class="card" id="s-getting-started"></section>
          <section class="card" id="s-models"></section>
          <section class="card" id="s-parts"></section>
        `;
        app.appendChild(wrap);
        updateTexts();
      }

      function updateTexts() {
        const pyxelLink = link("https://github.com/kitao/pyxel", "Pyxel");

        document.title = t("title");
        document.getElementById("page-title").textContent = t("title");
        document.getElementById("page-subtitle").innerHTML = t(
          "subtitle",
        ).replace("{0}", pyxelLink);

        document.getElementById("s-overview").innerHTML = `
          <h2 class="section-title">${esc(t("overview_title"))}</h2>
          <p class="body">${t("overview_body").replace("{0}", "<strong>Pyxel Cube</strong>")}</p>
          <p class="body mt-2">${esc(t("wip"))}</p>`;

        document.getElementById("s-getting-started").innerHTML = `
          <h2 class="section-title">${esc(t("start_title"))}</h2>
          <p class="body">${esc(t("start_body"))}</p>
          ${code(
            `import pyxel
from pyxel.cube import Camera, Mat4, Node, Vec3

class Scene(Node):
    def __init__(self):
        super().__init__()
        self.camera = Camera()
        self.camera.transform = Mat4.look_at(Vec3(0.0, 78.0, 104.0), Vec3.ZERO)

    def on_draw(self):
        self.box(Mat4.IDENTITY, Vec3(26.0, 26.0, 26.0), 11)

pyxel.init(200, 150)
scene = Scene()

def update():
    scene.update()

def draw():
    scene.draw(0, 0, pyxel.width, pyxel.height)

pyxel.run(update, draw)`,
            "python",
          )}`;

        document.getElementById("s-models").innerHTML = `
          <h2 class="section-title">${esc(t("models_title"))}</h2>
          <p class="body">${t("models_palette").replace("{0}", link("https://kitao.github.io/pyxel/docs/pyxel.gpl", "pyxel.gpl"))}</p>
          <ul class="list-disc pl-6 space-y-2 body mt-2">
            <li>${esc(t("models_import"))}</li>
            <li>${esc(t("models_edit"))}</li>
            <li>${esc(t("models_export"))}</li>
          </ul>`;

        document.getElementById("s-parts").innerHTML = `
          <h2 class="section-title">${esc(t("parts_title"))}</h2>
          <p class="body">${esc(t("parts_open"))}</p>
          <ul class="list-disc pl-6 space-y-2 body mt-2">
            <li>${esc(t("parts_grid"))}</li>
            <li>${esc(t("parts_join"))}</li>
            <li>${esc(t("parts_collision"))}</li>
          </ul>`;

        setDocLang(lang);
        hljs.highlightAll();
      }

      initPage("user-guide.json", buildPage);
    </script>
  </body>
</html>
