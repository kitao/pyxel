name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-web-wheel:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the retained WebAssembly wheel and its build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- wasm/pyxel-*.whl
          test "$#" -eq 1
          wheel=$1
          python3 scripts/check_wasm_wheel --release "$wheel"
          # The release wheel is installed after its source commit has been built.
          wheel_commit=$(git log -1 --format=%H -- "$wheel")
          source=$(git rev-parse "$wheel_commit^")
          gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-wasm.yml" \
            --deny-self-hosted-runners --source-digest "$source"
          git diff --exit-code --no-patch -G'^const PYODIDE_VERSION ' \
            "$source" HEAD -- wasm/pyxel.js
          git diff --exit-code --no-patch "$source" HEAD -- crates python/pyxel \
            python/pyproject.toml python/requirements.txt Makefile rust-toolchain.toml \
            LICENSE README.md scripts/generate_docs scripts/generate_pyi_docstrings \
            web/api-reference .github/workflows/build-wasm.yml

  build:
    uses: ./.github/workflows/build.yml

  publish:
    runs-on: ubuntu-24.04
    needs: [build, verify-web-wheel]
    environment:
      name: pypi
      url: https://pypi.org/p/pyxel
    permissions:
      id-token: write

    steps:
      - &download-wheels
        name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
          path: dist
          pattern: pyxel-*

      - name: Verify the wheels selected for publication
        run: |
          python3 - <<'PY'
          import os
          from importlib.metadata import distributions
          from pathlib import Path

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          wheels = list(Path("dist").iterdir())
          if not wheels:
              raise SystemExit("No release wheels were downloaded")
          for wheel in wheels:
              if wheel.suffix != ".whl" or not wheel.name.startswith(f"pyxel-{expected}-"):
                  raise SystemExit(f"Unexpected release artifact: {wheel.name}")
              project, = distributions(path=[str(wheel)])
              if project.name != "pyxel" or project.version != expected:
                  raise SystemExit(f"{wheel.name} contains {project.name} {project.version}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: false

  release:
    runs-on: ubuntu-24.04
    needs: publish
    permissions:
      contents: write

    steps:
      - *download-wheels

      - name: Get Pyxel version
        run: |
          PYXEL_VERSION=$(echo $GITHUB_REF | sed 's/refs\/tags\/v//')
          echo "PYXEL_VERSION=${PYXEL_VERSION}" >> $GITHUB_ENV

      - name: Detect pre-release
        run: |
          if echo "$PYXEL_VERSION" | grep -qE '(a|b|rc)[0-9]+$'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          name: Pyxel ${{ env.PYXEL_VERSION }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          tag_name: ${{ github.ref }}
