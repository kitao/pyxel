name: Audit Windows desktop on candidate wheels

on:
  push:
    branches: [codex/3.0.3-build-audit-20261118]
    paths:
      - .github/audit/windows_return.py
      - .github/audit/cube_queries.py
      - .github/workflows/audit-windows-desktop.yml

permissions:
  contents: read
  actions: read

jobs:
  audit-windows-return:
    name: Audit Windows Arm64 window and console return
    runs-on: windows-11-arm
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          architecture: x64
          python-version: "3.15.2"
      - uses: actions/download-artifact@v8
        with:
          name: pyxel-x86_64-pc-windows-msvc
          path: dist
          run-id: 44536470700
          github-token: ${{ github.token }}
      - name: Download original wheel for the window-close regression check
        uses: actions/download-artifact@v8
        with:
          name: pyxel-x86_64-pc-windows-msvc
          path: original
          run-id: 44253616143
          github-token: ${{ github.token }}
      - name: Set up software OpenGL for the virtual Windows desktop
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $dir = Join-Path $env:RUNNER_TEMP 'pyxel-mesa'
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/25.2.6/mesa3d-25.2.6-release-msvc.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '4d21205818fb946c3a94ae2552364a1ef14d3f8a907ccd98585907cf536510a5') {
            throw 'Unexpected Mesa archive digest'
          }
          7z x $archive "-o$dir" x64/opengl32.dll x64/libgallium_wgl.dll
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract Mesa OpenGL' }
          $driver = (Resolve-Path "$dir/x64/opengl32.dll").Path
          "SDL_OPENGL_LIBRARY=$driver" >> $env:GITHUB_ENV

      - name: Check normal window close and Escape on the built wheel
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          GALLIUM_DRIVER: softpipe
        run: |
          python -m pip install --no-index --no-deps dist/*.whl
          python .github/audit/resource_save.py
          python .github/audit/cube_queries.py
          python .github/audit/windows_return.py
          if cmp -s dist/*.whl original/*.whl; then
            echo 'Original wheel is byte-identical to the tested wheel'
          else
            python -m pip install --force-reinstall --no-index --no-deps original/*.whl
            python .github/audit/windows_return.py
          fi
