name: Audit Linux desktop on candidate wheels

on:
  push:
    branches: [codex/3.0.3-build-audit-20261118]
    paths:
      - .github/audit/linux_desktop.py
      - .github/audit/linux_window.c
      - .github/workflows/audit-linux-desktop.yml

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pyxel-${{ matrix.target }}
          path: dist
          run-id: 44464593173
          github-token: ${{ github.token }}
      - name: Set up the virtual display and audio monitor
        run: |
          sudo apt-get -qq update
          sudo apt-get -y -qq install --no-install-recommends libsdl2-dev openbox xvfb xauth xdotool x11-apps libgl1-mesa-dri imagemagick pulseaudio pulseaudio-utils python3-venv
          cc -shared -fPIC .github/audit/linux_window.c -o .github/audit/linux_window.so $(pkg-config --cflags --libs sdl2)
          /usr/bin/python3 -m venv "$RUNNER_TEMP/pyxel-audit-python"
          "$RUNNER_TEMP/pyxel-audit-python/bin/pip" install --no-index --no-deps dist/*.whl
      - name: Check saved resources in the candidate wheel
        env:
          SDL_AUDIODRIVER: dummy
        run: '"$RUNNER_TEMP/pyxel-audit-python/bin/python" .github/audit/resource_save.py'
      - name: Exercise the normal X11 window, keyboard, pointer and PulseAudio output
        env:
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: pulseaudio
          LIBGL_ALWAYS_SOFTWARE: "true"
          PULSE_SINK: pyxel_audit
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=pyxel_audit rate=44100
          xvfb-run -a -s '-screen 0 800x600x24 +extension GLX' bash -euc '
            openbox > "$RUNNER_TEMP/pyxel-openbox.log" 2>&1 &
            for i in {1..50}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.1
            done
            "$RUNNER_TEMP/pyxel-audit-python/bin/python" .github/audit/linux_desktop.py
          '
