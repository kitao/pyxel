title: "Your Work Title / 作品名"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Share your Pyxel work! Your submission will be featured on the [Pyxel User Examples](https://kitao.dev/pyxel/user-examples/) page. Enter your work's title in the Title field above.
        Pyxel で作った作品を投稿してください！投稿された作品は [Pyxel User Examples](https://kitao.dev/pyxel/user-examples/) ページで紹介されます。上の Title に作品名を入力してください。
  - type: input
    id: description
    attributes:
      label: "Description / 作品の説明"
      description: "Brief one-line description of your work / 作品を一行で説明してください"
      placeholder: "e.g. Side-scrolling action game / 例: 横スクロールアクションゲーム"
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: "Site (optional) / 作品紹介ページ（任意）"
      description: "A page about your work, such as its website or repository. If people can play on the same page, just enter it under Play. / 作品の紹介ページやリポジトリの URL。同じページで遊べる場合は、次の Play 欄だけで大丈夫です。"
    validations:
      required: false
  - type: input
    id: play
    attributes:
      label: "Play (optional) / 遊べる URL（任意）"
      description: "A page where people can play in their browser, or a link to your .pyxapp file. / ブラウザで遊べるページ、または公開している .pyxapp ファイルの URL。"
    validations:
      required: false
  - type: checkboxes
    id: mobile
    attributes:
      label: "Mobile play (optional) / スマホ対応（任意）"
      options:
        - label: "I've checked that I can play using only my phone's touchscreen. / スマホの画面操作だけで一通り遊べることを確認しました。"
  - type: input
    id: author
    attributes:
      label: "Your name / あなたの名前"
      description: "Name to be credited on the examples page / 紹介ページに掲載する名前を記入してください"
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: "Contact (optional) / 連絡先（任意）"
      description: "Email, GitHub, or X account for the examples page / 紹介ページに掲載する連絡先を記入してください（メール、GitHub、X アカウント）"
    validations:
      required: false
  - type: textarea
    id: gif
    attributes:
      label: "Screen Capture GIF / 画面キャプチャ GIF"
      description: >
        In your Pyxel app, press Alt(Option)+2 to start recording and
        Alt(Option)+3 to save as GIF. Drag & drop the saved file here.
        Aim for 3 MB or less. We may shorten larger GIFs for the gallery. /
        Pyxel アプリの実行中に Alt(Option)+2 で録画開始、Alt(Option)+3 で GIF として保存できます。
        保存したファイルをここにドラッグ&ドロップしてください。3 MB 以下が目安です。超える場合は、掲載時に GIF を短くすることがあります。
    validations:
      required: true
