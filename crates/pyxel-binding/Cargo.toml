[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "pyxel-binding"
publish = false
version.workspace = true

[lib]
crate-type = ["cdylib"]
name = "pyxel_binding"

[dependencies]
# abi3-py311 matches the package's minimum supported Python
# (pyproject requires-python >= 3.11); multiple-pymethods lets
# binding modules split #[pymethods] across files
pyo3 = { features = ["abi3-py311", "extension-module", "multiple-pymethods"], version = "0.29" }
pyxel-core = { path = "../pyxel-core" }

# sysinfo has no Emscripten target; exclude from WASM builds
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
sysinfo = "0.39"

[features]
sdl2_dynamic = ["pyxel-core/sdl2_dynamic"]
sdl2_static = ["pyxel-core/sdl2_static"]
