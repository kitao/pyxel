<!doctype html>
<meta charset="utf-8" />
<title>Pyxel Pocket Smoke</title>
<script src="pyxel-pocket.js"></script>
<script>
  const query = new URLSearchParams(location.search);
  const mode = query.get("mode");
  const shouldFail = query.has("fail");
  launchPyxelPocket({
    command: "run",
    name: "pocket-smoke.py",
    script: shouldFail
      ? 'raise RuntimeError("pocket smoke failure")'
      : mode === "flip"
        ? `
import pyxel

pyxel.init(64, 64, title="Pocket Web Smoke")

def draw():
    pyxel.cls(1)
    pyxel.rect(8, 8, 48, 48, 11)
    pyxel.text(14, 28, "Pocket", 7)

draw()
pyxel.flip()
`
        : `
import pyxel

x = 0

pyxel.init(64, 64, title="Pocket Web Run Smoke")

def update():
    global x
    x = (x + 1) % 64
    pyxel.title("Pocket Web Run " + str(x))

def draw():
    pyxel.cls(1)
    pyxel.rect(x, 8, 12, 48, 11)
    pyxel.text(14, 28, "Run", 7)

pyxel.run(update, draw)
`,
  });
</script>
